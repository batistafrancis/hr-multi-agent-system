name: CI

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src scripts tests
      - name: Check formatting
        run: python -m black --check src scripts tests
      - name: Type check
        run: python -m mypy src --ignore-missing-imports
      - name: Run offline unit and graph integration tests
        run: python -m pytest tests -v

  docker-build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: hr-multi-agent-system:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check runtime imports
        run: docker run --rm hr-multi-agent-system:ci python -c "from src.api.main import app; assert app.title == 'HR Multi-Agent System'"
