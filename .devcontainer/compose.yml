services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspaces/hr-multi-agent-system:cached
      - copilot_state:/home/vscode/.copilot
      - vscode_data:/home/vscode/.vscode-server/data
    working_dir: /workspaces/hr-multi-agent-system
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3.5:4b
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
  copilot_state:
    name: hr-multi-agent-copilot-state
  vscode_data:
    name: hr-multi-agent-vscode-data
